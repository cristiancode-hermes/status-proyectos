<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>proyectos.cristiancode.dev</title>
<style>
:root {
  --bg: #0a0a0f;
  --surface: rgba(20,20,30,.65);
  --surface-hover: rgba(30,30,45,.8);
  --border: rgba(255,255,255,.06);
  --border-hover: rgba(255,255,255,.12);
  --accent: #ffac02;
  --accent-dim: rgba(255,172,2,.25);
  --text: #e2e2ea;
  --text-dim: #8888a0;
  --text-muted: #55556a;
  --radius: 12px;
  --font: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono: 'SF Mono','Fira Code','Cascadia Code',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100dvh;
  overflow-x:hidden;
  line-height:1.5;
}
/* ── Animated mesh gradient background ── */
.bg-mesh{
  position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 20% 20%,rgba(255,172,2,.04) 0%,transparent 60%),
             radial-gradient(ellipse 60% 50% at 80% 30%,rgba(99,102,241,.06) 0%,transparent 60%),
             radial-gradient(ellipse 70% 40% at 50% 80%,rgba(34,197,94,.03) 0%,transparent 60%);
}
.bg-mesh::before,.bg-mesh::after{
  content:'';position:absolute;border-radius:50%;
  filter:blur(80px);opacity:.3;animation:meshFloat 20s ease-in-out infinite;
}
.bg-mesh::before{
  width:600px;height:600px;background:rgba(255,172,2,.08);
  top:-200px;left:-200px;animation-delay:0s;
}
.bg-mesh::after{
  width:500px;height:500px;background:rgba(99,102,241,.1);
  bottom:-150px;right:-150px;animation-delay:-10s;
}
@keyframes meshFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(80px,-60px) scale(1.1)}
  66%{transform:translate(-40px,40px) scale(.95)}
}
/* ── Particles ── */
.particles{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.particle{
  position:absolute;width:3px;height:3px;background:rgba(255,172,2,.2);border-radius:50%;
  animation:particleFloat 15s linear infinite;
}
.particle:nth-child(1){top:10%;left:20%;animation-delay:0s;animation-duration:18s}
.particle:nth-child(2){top:60%;left:80%;animation-delay:-3s;animation-duration:14s;width:2px;height:2px}
.particle:nth-child(3){top:30%;left:60%;animation-delay:-7s;animation-duration:20s}
.particle:nth-child(4){top:80%;left:30%;animation-delay:-11s;animation-duration:16s;width:4px;height:4px;background:rgba(99,102,241,.15)}
.particle:nth-child(5){top:50%;left:50%;animation-delay:-5s;animation-duration:22s;width:2px;height:2px}
@keyframes particleFloat{
  0%{transform:translateY(40px) scale(.5);opacity:0}
  20%{opacity:1}
  80%{opacity:1}
  100%{transform:translateY(-200px) scale(1);opacity:0}
}
/* ── Layout ── */
.container{max-width:960px;margin:0 auto;padding:clamp(24px,5vw,48px) clamp(16px,3vw,24px)}
/* ── Header ── */
.header{text-align:center;margin-bottom:clamp(24px,4vw,40px);animation:fadeInUp .6s ease}
.header .logo{font-size:clamp(2rem,5vw,3.5rem);font-weight:800;background:linear-gradient(135deg,var(--accent),#fbbf24,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;margin-bottom:6px;letter-spacing:-1px}
.header .subtitle{font-size:clamp(13px,2vw,16px);color:var(--text-dim);margin-bottom:clamp(16px,3vw,24px)}
.header .subtitle span{color:var(--accent);-webkit-text-fill-color:var(--accent)}
/* ── Stats Bar ── */
.stats-bar{
  display:flex;justify-content:center;gap:clamp(12px,3vw,28px);flex-wrap:wrap;
  margin-bottom:clamp(20px,3vw,32px);padding:clamp(12px,2vw,18px) clamp(16px,3vw,24px);
  background:var(--surface);backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:var(--radius);
  animation:fadeInUp .6s ease .1s both;
}
.stat-item{text-align:center}
.stat-item .stat-value{font-size:clamp(20px,3vw,28px);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.stat-item .stat-label{font-size:clamp(10px,1.2vw,12px);color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.stat-item .stat-icon{font-size:clamp(14px,1.5vw,18px);display:block;margin-bottom:2px}
/* ── Search ── */
.search-wrap{position:relative;max-width:420px;margin:0 auto clamp(20px,3vw,28px);animation:fadeInUp .6s ease .2s both}
.search-wrap input{
  width:100%;padding:clamp(10px,1.5vw,14px) clamp(36px,5vw,44px) clamp(10px,1.5vw,14px) clamp(34px,5vw,42px);
  border-radius:var(--radius);border:1px solid var(--border);
  background:var(--surface);backdrop-filter:blur(12px);
  color:var(--text);font-size:clamp(13px,1.5vw,15px);outline:none;
  transition:all .25s;font-family:var(--font);
}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search-wrap input::placeholder{color:var(--text-muted)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text-muted);pointer-events:none}
.search-clear{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;
  color:var(--text-muted);font-size:16px;cursor:pointer;padding:4px;border-radius:50%;display:none;line-height:1;
}
.search-clear:hover{color:var(--text);background:var(--surface-hover)}
.search-count{text-align:center;font-size:12px;color:var(--text-muted);margin-top:-12px;margin-bottom:16px;min-height:20px;animation:fadeInUp .3s ease}
/* ── Core links ── */
.core-links{
  display:flex;justify-content:center;gap:clamp(6px,1vw,10px);flex-wrap:wrap;
  margin-bottom:clamp(20px,3vw,32px);animation:fadeInUp .6s ease .25s both;
}
.core-link{
  padding:clamp(7px,1vw,10px) clamp(14px,2vw,20px);
  border-radius:8px;border:1px solid var(--border);
  background:var(--surface);backdrop-filter:blur(8px);
  font-size:clamp(12px,1.3vw,14px);font-weight:500;
  color:var(--text-dim);text-decoration:none;transition:all .2s;
}
.core-link:hover{
  background:var(--surface-hover);border-color:var(--accent-dim);color:var(--accent);text-decoration:none;
  transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,172,2,.1)
}
/* ── Category tabs ── */
.tab-bar{
  display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:clamp(16px,2vw,24px);
  scrollbar-width:none;-webkit-overflow-scrolling:touch;animation:fadeInUp .6s ease .3s both;
}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{
  flex-shrink:0;padding:clamp(6px,1vw,9px) clamp(12px,1.5vw,18px);
  border-radius:20px;border:1px solid var(--border);background:transparent;
  color:var(--text-muted);font-size:clamp(11px,1.2vw,13px);cursor:pointer;
  transition:all .2s;white-space:nowrap;font-family:var(--font);font-weight:500;
}
.tab-btn:hover{background:var(--surface);color:var(--text-dim)}
.tab-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
/* ── Category sections ── */
.category{margin-bottom:clamp(20px,3vw,32px);animation:fadeInUp .5s ease;transition:opacity .3s,transform .3s}
.category.hidden{display:none}
.category-title{
  font-size:clamp(12px,1.3vw,14px);font-weight:700;text-transform:uppercase;
  letter-spacing:1px;color:var(--text-muted);margin-bottom:clamp(10px,1.5vw,16px);
  display:flex;align-items:center;gap:10px;
}
.category-title::after{content:'';flex:1;height:1px;background:var(--border)}
.category-count{font-size:11px;color:var(--text-muted);font-weight:400;letter-spacing:0;text-transform:none;margin-left:4px}
/* ── Project grid ── */
.project-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(140px,16vw,180px),1fr));
  gap:clamp(5px,.8vw,8px);
}
.project-card{
  display:block;padding:clamp(8px,1vw,12px) clamp(10px,1.2vw,16px);
  border-radius:10px;border:1px solid var(--border);
  background:var(--surface);backdrop-filter:blur(6px);
  font-size:clamp(12px,1.2vw,14px);color:var(--text-dim);
  text-decoration:none;transition:all .2s;
  overflow:hidden;position:relative;
}
.project-card::before{
  content:'';position:absolute;inset:0;opacity:0;
  background:linear-gradient(135deg,rgba(255,172,2,.05),transparent);
  transition:opacity .3s;
}
.project-card:hover{
  border-color:var(--accent-dim);color:var(--accent);
  transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.3);text-decoration:none;
}
.project-card:hover::before{opacity:1}
.project-card .card-name{position:relative;z-index:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project-card .card-indicator{
  display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:7px;
  background:var(--text-muted);vertical-align:middle;transition:background .3s;
}
.project-card:hover .card-indicator{background:var(--accent)}
/* ── Footer ── */
.footer{
  margin-top:clamp(32px,5vw,48px);
  padding-top:clamp(16px,2vw,24px);
  border-top:1px solid var(--border);
  text-align:center;font-size:clamp(11px,1vw,13px);color:var(--text-muted);
  animation:fadeInUp .6s ease .4s both;
}
.footer a{color:var(--text-dim);text-decoration:none;transition:color .2s}
.footer a:hover{color:var(--accent);text-decoration:none}
.footer .dot{margin:0 6px;color:var(--text-muted)}
/* ── Animations ── */
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* ── No results ── */
.no-results{text-align:center;padding:clamp(32px,6vw,60px);color:var(--text-muted);animation:fadeIn .3s ease}
.no-results .icon{font-size:clamp(32px,5vw,48px);margin-bottom:12px;display:block}
.no-results .msg{font-size:clamp(13px,1.5vw,15px);margin-bottom:4px}
.no-results .hint{font-size:12px;color:var(--text-muted)}
/* ── Highlight match ── */
.highlight{background:var(--accent-dim);color:var(--accent);padding:0 3px;border-radius:3px}
</style>
</head>

const CATEGORIES = [

      {name:'newsletter', url:'https://newsletter.proyectos.cristiancode.dev'},
      {name:'survey-engine', url:'https://survey-engine.proyectos.cristiancode.dev'},
      {name:'survey-studio', url:'https://survey-studio.proyectos.cristiancode.dev'},
    ]},
  { id:'productividad', label:'Productividad', icon:'⏱️',
    projects:[
      {name:'habits', url:'https://habits.proyectos.cristiancode.dev'},

      {name:'pomodoro', url:'https://pomodoro.proyectos.cristiancode.dev'},

  { id:'social', label:'Social', icon:'🌐',
    projects:[
      {name:'events', url:'https://events.proyectos.cristiancode.dev'},
      {name:'snippets', url:'https://snippets.proyectos.cristiancode.dev'},
      {name:'social', url:'https://social.proyectos.cristiancode.dev'},

      {name:'cpp-sys-report', url:'https://github.com/cristiancode-hermes/hermes-2026-07-26-cpp-sys-report'},
    ]},
];

// ── Render ──
function render(){
  renderTabs();
  renderCategories();
}

function renderTabs(){
  const bar = document.getElementById('tabBar');
  // "All" tab
  const all = document.createElement('button');
  all.className = 'tab-btn active';
  all.textContent = '✨ Todos';
  all.dataset.tab = 'all';
  all.onclick = () => filterTab('all');
  bar.appendChild(all);
  // Category tabs
  CATEGORIES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.textContent = c.icon + ' ' + c.label;
    btn.dataset.tab = c.id;
    btn.onclick = () => filterTab(c.id);
    bar.appendChild(btn);
  });
}

function filterTab(tabId){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  document.querySelectorAll('.category').forEach(el => {
    if(tabId === 'all'){el.classList.remove('hidden')}
    else{el.classList.toggle('hidden', el.dataset.cat !== tabId)}
  });
  // Re-apply search filter
  doSearch();
}

function renderCategories(){
  const container = document.getElementById('categories');
  CATEGORIES.forEach(c => {
    const section = document.createElement('div');
    section.className = 'category';
    section.dataset.cat = c.id;
    section.innerHTML = `<div class="category-title">${c.icon} ${c.label} <span class="category-count">${c.projects.length}</span></div><div class="project-grid">${c.projects.map(p => `<a href="${p.url}" class="project-card" data-name="${p.name.toLowerCase()}"><span class="card-indicator"></span><span class="card-name">${p.name}</span></a>`).join('')}</div>`;
    container.appendChild(section);
  });
}

// ── Search ──
function doSearch(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const count = document.getElementById('searchCount');
  const noRes = document.getElementById('noResults');
  const clear = document.getElementById('clearBtn');
  clear.style.display = q ? 'block' : 'none';

  if(!q){
    // Show all, remove highlights
    document.querySelectorAll('.category').forEach(el => el.classList.remove('hidden'));
    document.querySelectorAll('.card-name').forEach(el => el.innerHTML = el.textContent);
    document.querySelectorAll('.project-card').forEach(el => el.style.display = '');
    count.textContent = '';
    noRes.style.display = 'none';
    // Reset tabs
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'all'));
    return;
  }

  let totalVisible = 0;
  document.querySelectorAll('.category').forEach(cat => {
    let catVisible = 0;
    cat.querySelectorAll('.project-card').forEach(card => {
      const name = card.dataset.name;
      const span = card.querySelector('.card-name');
      if(name.includes(q)){
        card.style.display = '';
        span.innerHTML = highlightText(span.textContent, q);
        catVisible++;
      } else {
        card.style.display = 'none';
      }
    });
    cat.classList.toggle('hidden', catVisible === 0);
    if(catVisible > 0) totalVisible += catVisible;
  });

  if(totalVisible === 0){
    noRes.style.display = 'block';
    count.textContent = '';
  } else {
    noRes.style.display = 'none';
    count.textContent = `📌 ${totalVisible} proyecto${totalVisible !== 1 ? 's' : ''} encontrado${totalVisible !== 1 ? 's' : ''}`;
  }

  // Reset tabs since search overrides them
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
}

function highlightText(text, query){
  const idx = text.toLowerCase().indexOf(query);
  if(idx === -1) return text;
  return text.slice(0, idx) + '<span class="highlight">' + text.slice(idx, idx + query.length) + '</span>' + text.slice(idx + query.length);
}

function clearSearch(){
  document.getElementById('searchInput').value = '';
  doSearch();
  document.getElementById('searchInput').focus();
}

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  render();
  document.getElementById('searchInput').addEventListener('input', doSearch);
  // Animate stat values
  setTimeout(() => {
    [36,30,5].forEach((val, i) => {
      const el = document.querySelectorAll('.stat-value')[i];
      if(!el) return;
      let cur = 0;
      const step = Math.ceil(val / 20);
      const iv = setInterval(() => {
        cur += step;
        if(cur >= val){cur = val; clearInterval(iv)}
        el.textContent = cur;
      }, 40);
    });
  }, 300);
});
</script>
